name: Rust
run-name: "Rust ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches: ["main"]
    paths:
      - crates/**
      - rust.yml
      - Cargo.lock
      - Cargo.toml
  pull_request:
    branches: ["main"]
    paths:
      - crates/**
      - rust.yml
      - Cargo.lock
      - Cargo.toml

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
  CARGO_TERM_COLOR: always

jobs:
  test-crates:
    name: test-indexer
    runs-on: ubuntu-latest
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - uses: taiki-e/install-action@cargo-nextest
      - name: Install postgres
        shell: bash
        run: |
          sudo apt update && sudo apt install postgresql

      - name: Add postgres to PATH
        run: echo "/usr/lib/postgresql/16/bin" >> $GITHUB_PATH

      - name: Run deepbook-indexer tests
        run: |
          cargo nextest run -E 'package(deepbook-indexer)'

      - name: Run deepbook-server tests
        run: |
          cargo nextest run -E 'package(deepbook-server)'

  rustfmt:
    runs-on: [ ubuntu-latest ]
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - run: rustup component add rustfmt
      - run: cargo fmt --check
